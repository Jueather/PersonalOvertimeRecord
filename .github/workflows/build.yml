# Workflow A：每次 push / PR 自动构建，上传 APK 产物（Actions 页面可直接下载）
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # 允许在 GitHub 页面手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 上提交的 gradlew 会丢失可执行位，这里确保 Linux 运行器能运行
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub Ubuntu runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 无需 android-actions/setup-android：其 v3 默认尝试安装已被 Google 下架的 tools 包，
      # 导致 sdkmanager 报 "Failed to find package 'tools'" 使 CI 失败
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
          ls "$ANDROID_HOME/build-tools" | tail -5

      # 自动缓存 ~/.gradle 与构建缓存，第二次起构建只需 1~2 分钟
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 注：若已配置签名 Secrets，debug 与 release 均用 release 签名打包
      #（debug 版可被 release 版直接覆盖升级，见 build.gradle.kts buildTypes.debug）；
      # 未配置 Secrets 时仍可正常出未签名包。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 把 APK 重命名为带版本号的名字（PersonalOvertimeRecord_v<版本>_<构建类型>.apk），
      # 便于在 Actions 下载页 / GitHub Release 中直接区分版本。
      # 版本号从 APK 文件名提取（由 build.gradle.kts 按 appVersionName 生成），
      # 不依赖 app/version.properties（该文件已移出版本控制，本机自增构建号）。
      - name: Rename APKs with version
        run: |
          FIRST_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          VERSION=$(basename "$FIRST_APK" | sed -E 's/^PersonalOvertimeRecord_v([0-9.]+)_[0-9]+_debug\.apk$/\1/')
          echo "Renaming APKs to PersonalOvertimeRecord_v${VERSION}_<buildType>.apk"
          count=0
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            if [ "$count" = "1" ]; then
              mv "$f" "app/build/outputs/apk/debug/PersonalOvertimeRecord_v${VERSION}_debug.apk"
            else
              mv "$f" "app/build/outputs/apk/debug/PersonalOvertimeRecord_v${VERSION}_debug_${count}.apk"
            fi
          done
          count=0
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            if [ "$count" = "1" ]; then
              mv "$f" "app/build/outputs/apk/release/PersonalOvertimeRecord_v${VERSION}_release.apk"
            else
              mv "$f" "app/build/outputs/apk/release/PersonalOvertimeRecord_v${VERSION}_release_${count}.apk"
            fi
          done
          echo "--- debug ---"; ls -1 app/build/outputs/apk/debug/
          echo "--- release ---"; ls -1 app/build/outputs/apk/release/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
