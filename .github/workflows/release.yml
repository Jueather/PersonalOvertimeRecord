# Workflow B：打 tag（如 v1.3.0）时，用 GitHub Secrets 里的 keystore 签名，
# 并自动创建 GitHub Release 挂载 APK。
# 使用前需在仓库 Settings -> Secrets and variables -> Actions 添加：
#   KEYSTORE_BASE64   keystore 文件的 base64 内容
#   KEYSTORE_PASSWORD keystore 密码
#   KEY_ALIAS         别名（默认 overtime）
#   KEY_PASSWORD      密钥密码
name: Release

on:
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 / v1.3.0 这类 tag 时触发
  workflow_dispatch:

permissions:
  contents: write      # 允许创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 上提交的 gradlew 会丢失可执行位，这里确保 Linux 运行器能运行
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub Ubuntu runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 无需 android-actions/setup-android：其 v3 默认尝试安装已被 Google 下架的 tools 包，
      # 导致 sdkmanager 报 "Failed to find package 'tools'" 使 CI 失败
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
          ls "$ANDROID_HOME/build-tools" | tail -5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Verify keystore & print alias
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore 2>/dev/null || echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          echo "=== keystore 别名(alias)与 store 密码校验 ==="
          keytool -list -keystore /tmp/release.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 || echo "⚠️  store 密码错误，请检查 KEYSTORE_PASSWORD"

      - name: Build signed APK from tag
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 兼容两种 tag 版本号格式：
          #   3 段 v1.3.0   -> versionCode 10300
          #   4 段 v0.1.4.1 -> versionCode 0010401 (即 10401)
          VERSION="${GITHUB_REF_NAME#v}"
          SEGS=$(echo "$VERSION" | awk -F. '{print NF}')
          if [ "$SEGS" = "3" ]; then
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          else
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d%02d", $1, $2, $3, $4}')
          fi
          echo "Building versionName=$VERSION versionCode=$CODE"
          ./gradlew assembleRelease \
            -PciVersionName="$VERSION" \
            -PciVersionCode="$CODE"

      # 把 release APK 重命名为带 tag 版本号的名字（PersonalOvertimeRecord_v<tag>_release.apk），
      # 必须放在生成 latest.json 之前，保证清单里的下载链接与实际上传文件名一致。
      - name: Rename release APK with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Renaming release APK to PersonalOvertimeRecord_${VERSION}_release.apk"
          count=0
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            if [ "$count" = "1" ]; then
              mv "$f" "app/build/outputs/apk/release/PersonalOvertimeRecord_${VERSION}_release.apk"
            else
              mv "$f" "app/build/outputs/apk/release/PersonalOvertimeRecord_${VERSION}_release_${count}.apk"
            fi
          done
          echo "--- release output ---"
          ls -1 app/build/outputs/apk/release/

      - name: Generate latest.json update manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # 与 Build 步骤相同的版本号逻辑（run 之间 shell 状态不保留，需重新计算）
          VERSION="${GITHUB_REF_NAME#v}"
          SEGS=$(echo "$VERSION" | awk -F. '{print NF}')
          if [ "$SEGS" = "3" ]; then
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          else
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d%02d", $1, $2, $3, $4}')
          fi

          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APK_NAME=$(basename "$APK")
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          # 更新日志：自上个 tag 以来的提交记录（无上个 tag 时取最近 10 条）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline "$PREV_TAG..HEAD" | head -n 30)
          else
            CHANGES=$(git log --oneline -10)
          fi

          # minVersionCode 填 0、minVersionName 填空串表示非强制更新；
          # 需要强制时把 minVersionName 设为目标最低版本号（如 "1.2.0"），
          # 或把 minVersionCode 设为目标最低 versionCode（两者择一即可，minVersionName 优先）。
          jq -n \
            --arg versionCode "$CODE" \
            --arg versionName "$VERSION" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}" \
            --arg sha256 "$SHA256" \
            --arg changelog "$CHANGES" \
            --argjson minVersionCode 0 \
            --arg minVersionName "" \
            '{versionCode: ($versionCode|tonumber), versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, changelog: $changelog, minVersionCode: $minVersionCode, minVersionName: $minVersionName}' \
            > app/build/outputs/apk/release/latest.json

          echo "=== latest.json ==="
          cat app/build/outputs/apk/release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/latest.json
          generate_release_notes: true
