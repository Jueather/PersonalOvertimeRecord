ktor {
  deployment {
    port = 8080
  }
  application {
    modules = [ com.example.overtimeserver.ApplicationKt.module ]
  }
}

overtime {
  # SQLite 数据库文件路径（建议放 /var/lib/overtime-server/overtime.db）
  dbPath = "./data/overtime.db"
  # JWT 签名密钥文件：留空文件不存在时首启自动生成并持久化（保证重启后 token 不失效）
  jwtSecretFile = "./data/jwt-secret.key"
  # 首次启动自动创建的管理员用户名（仅 users 表为空时生效）
  adminUsername = "admin"
  jwt {
    issuer = "overtime-server"
    audience = "overtime-app"
    # token 有效期（天）
    expiryDays = 30
  }
}
